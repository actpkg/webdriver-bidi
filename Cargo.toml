[package]
name = "component-webdriver-bidi"
description = "Drive a local browser over WebDriver BiDi — capability-gated, loopback-only"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["act", "webdriver", "bidi", "browser", "wasm"]
repository = "https://github.com/actpkg/webdriver-bidi"

[dependencies]
act-sdk = "0.12"
wit-bindgen = { version = "0.58", features = ["async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ciborium = "0.2"
base64 = "0.22"
tokio = { version = "1.51", features = ["rt", "net", "time", "macros", "io-util"] }
# default-features = false keeps native-tls out; it does not build for wasip2.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[lib]
crate-type = ["cdylib"]
