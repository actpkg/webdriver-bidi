name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      # `just init` fetches wit/deps; without it the build has no WIT to bind against.
      - run: just init
      - run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/*.wasm

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - run: cargo fmt -- --check
      - run: just init
      - run: cargo clippy -- -D warnings

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - run: just init
      # Unit tests run on the host target, not wasm.
      - run: just unit

  e2e:
    name: E2E Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - run: npm i -g @actcore/act @actcore/act-build
      # Rebuild rather than download: `just test` packs, and packing an
      # artifact without wit/deps present yields no declared ceiling, so every
      # grant is denied and the e2e fails confusingly.
      - run: just init
      - run: just build
      # Diagnostic for a CI-only hang under active investigation: this calls
      # only the guest's `list-tools` export (what the MCP host asks for
      # during `initialize`, before serving begins) — no MCP, no stdio
      # server, no session, no capability grant. It splits the hang cleanly:
      # if this hangs too, the guest itself stalls in list-tools; if it
      # succeeds, the stall is in the stdio serving path between this call
      # and the `initialize` response. `set +e`/`set -e` bracket the probe so
      # a hang or failure here doesn't block `just test` from also running
      # and yielding its own evidence in the same run.
      - name: "Diagnostic: probe list-tools directly"
        run: |
          set +e
          timeout 60 act info target/wasm32-wasip2/release/component_webdriver_bidi.wasm --tools --format json
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::LIST-TOOLS HUNG (timed out after 60s)"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::LIST-TOOLS FAILED (exit $code, not a timeout)"
          else
            echo "LIST-TOOLS SUCCEEDED"
          fi
      - run: just test

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [e2e, lint, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      id-token: write     # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - uses: sigstore/cosign-installer@v4.1.2
      - run: just init
      - name: Publish
        id: publish
        env:
          OCI_USERNAME: __token__
          OCI_PASSWORD: ${{ secrets.ACTPKG_TOKEN }}
          ACT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: just publish
      - name: Sign (keyless via GitHub OIDC)
        if: steps.publish.outputs.digest != ''
        env:
          ACTPKG_TOKEN: ${{ secrets.ACTPKG_TOKEN }}
          SUBJECT: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
        run: |
          echo "$ACTPKG_TOKEN" | cosign login actpkg.dev -u __token__ --password-stdin
          cosign sign --yes "$SUBJECT"
