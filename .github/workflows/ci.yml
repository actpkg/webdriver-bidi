name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      # `just init` fetches wit/deps; without it the build has no WIT to bind against.
      - run: just init
      - run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/*.wasm

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - run: cargo fmt -- --check
      - run: just init
      - run: cargo clippy -- -D warnings

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - run: just init
      # Unit tests run on the host target, not wasm.
      - run: just unit

  e2e:
    name: E2E Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - run: npm i -g @actcore/act @actcore/act-build
      # Rebuild rather than download: `just test` packs, and packing an
      # artifact without wit/deps present yields no declared ceiling, so every
      # grant is denied and the e2e fails confusingly.
      - run: just init
      - run: just build
      # Diagnostic for a CI-only hang under active investigation: this calls
      # only the guest's `list-tools` export (what the MCP host asks for
      # during `initialize`, before serving begins) — no MCP, no stdio
      # server, no session, no capability grant. It splits the hang cleanly:
      # if this hangs too, the guest itself stalls in list-tools; if it
      # succeeds, the stall is in the stdio serving path between this call
      # and the `initialize` response. `set +e`/`set -e` bracket the probe so
      # a hang or failure here doesn't block `just test` from also running
      # and yielding its own evidence in the same run.
      - name: "Diagnostic: probe list-tools directly"
        run: |
          set +e
          timeout 60 act info target/wasm32-wasip2/release/component_webdriver_bidi.wasm --tools --format json
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::LIST-TOOLS HUNG (timed out after 60s)"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::LIST-TOOLS FAILED (exit $code, not a timeout)"
          else
            echo "LIST-TOOLS SUCCEEDED"
          fi
      # Fourth hypothesis: MCP over stdio uses stdout as the protocol
      # channel, so a single stray byte written to stdout by the guest (or
      # anything linked into it) before or instead of a JSON-RPC frame would
      # corrupt framing — the client would then wait forever for a valid
      # message with no error and no close, exactly matching every
      # observation so far (list-tools unaffected because there stdout is
      # plain output, not a protocol stream; the audit banner always visible
      # because it is on stderr; `initialize` never completing). This feeds
      # one raw `initialize` request on stdin and dumps whatever comes back
      # on stdout, byte for byte (`cat -A` so stray whitespace/control
      # characters are visible rather than invisible). stderr is discarded —
      # the audit trail's content is already known and would only add noise
      # here. `set -o pipefail` so a mid-pipe timeout/kill is reflected in
      # `code` rather than swallowed by `cat -A`'s own clean exit.
      - name: "Diagnostic: raw initialize response over stdout"
        run: |
          set +e
          set -o pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"probe","version":"0"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | timeout 20 act run target/wasm32-wasip2/release/component_webdriver_bidi.wasm --mcp --allow wasi:sockets 2>/dev/null \
            | head -c 800 | cat -A
          code=$?
          set +o pipefail
          set -e
          echo "(end of probe output, pipeline exit $code)"
          if [ "$code" -ne 0 ]; then
            echo "::warning::PROBE TIMED OUT or failed (pipeline exit $code) — no valid response captured above"
          fi
      # Fifth angle: the pytest suite's `client` fixture never passes `env=`
      # to fastmcp's StdioTransport, so the underlying `mcp.client.stdio`
      # library spawns `act run` under a deliberately restricted environment
      # — on POSIX just HOME, LOGNAME, PATH, SHELL, TERM, USER
      # (`get_default_environment()` in the `mcp` package) — not the full job
      # environment the two probes above ran under. If `ACT` is unset here,
      # the justfile's/fixture's fallback command is resolved fresh inside
      # that six-variable environment too, so it matters concretely what it
      # resolves to.
      - name: "Diagnostic: what ACT resolves to"
        run: |
          echo "ACT=[${ACT:-<unset>}]"
          command -v act || echo "no bare 'act' on PATH"
      # An npm global bin entry is sometimes a node shim that re-spawns the
      # real binary rather than the binary itself — which would put a second
      # node process (invisible until now) in the middle of every act
      # invocation in this job, relaying stdio, and would mean the `node` in
      # earlier orphan-cleanup lists was never unambiguously the mock server.
      - name: "Diagnostic: what the npm-installed act binary actually is"
        run: |
          BIN=$(command -v act || true)
          echo "resolved: $BIN"
          if [ -n "$BIN" ]; then
            file "$BIN" || true
            head -c 64 "$BIN" | cat -A
          fi
      # Reproduce the exact restricted environment above, still with zero
      # Python/asyncio involved: if this hangs, the six-variable environment
      # is implicated regardless of asyncio's subprocess machinery; if it
      # answers cleanly like the previous probe, asyncio comes back into
      # frame and this environment is exonerated. `$CMD` mirrors the
      # fixture's own fallback (`os.environ.get("ACT", "act")`, word-split)
      # rather than hardcoding `act`, so this tests what the suite actually
      # invokes, not an assumption about it.
      - name: "Diagnostic: raw initialize response under stdio_client's restricted env"
        run: |
          set +e
          set -o pipefail
          CMD=${ACT:-act}
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"probe","version":"0"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | timeout 20 env -i HOME="$HOME" LOGNAME="$LOGNAME" PATH="$PATH" SHELL="$SHELL" TERM="$TERM" USER="$USER" \
              $CMD run target/wasm32-wasip2/release/component_webdriver_bidi.wasm --mcp --allow wasi:sockets 2>/dev/null \
            | head -c 800 | cat -A
          code=$?
          set +o pipefail
          set -e
          echo "(end of probe output, pipeline exit $code)"
          if [ "$code" -ne 0 ]; then
            echo "::warning::RESTRICTED-ENV PROBE TIMED OUT or failed (pipeline exit $code) — no valid response captured above"
          fi
      # Reframing: the audit banner proves `act` started, but the process was
      # absent from the job's own orphan-cleanup list at the last
      # cancellation — so the open question is not "does act hang" but
      # "does act exit on its own, and what does its stderr say when it
      # does." Every probe above closes stdin immediately (a one-shot
      # `printf | ...` pipe); fastmcp keeps stdin open for the life of the
      # session, which none of them have reproduced. This one does: a bash
      # `coproc` keeps act's stdin genuinely open after sending the same
      # initialize request, tries to read a response with a timeout, then
      # checks with `kill -0` whether the process is still alive — proving
      # liveness directly instead of inferring it from a client waiting in
      # `selector.poll()`. If it already exited, `wait` recovers the real
      # exit status and its stderr (captured to a file, never discarded)
      # names the reason.
      - name: "Diagnostic: does act exit on its own, with stdin held open"
        run: |
          set +e
          rm -f /tmp/act-coproc-stderr.log
          CMD=${ACT:-act}
          coproc ACTPROC ( exec 2>/tmp/act-coproc-stderr.log; $CMD run target/wasm32-wasip2/release/component_webdriver_bidi.wasm --mcp --allow wasi:sockets )
          ACTPID=$ACTPROC_PID
          echo "started act pid=$ACTPID"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"probe","version":"0"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' >&"${ACTPROC[1]}"
          if read -t 20 -u "${ACTPROC[0]}" response; then
            echo "GOT RESPONSE: $response"
          else
            echo "NO RESPONSE within 20s"
          fi
          if kill -0 "$ACTPID" 2>/dev/null; then
            echo "act (pid $ACTPID) still running with stdin held open — genuine hang, not an early exit"
            kill "$ACTPID" 2>/dev/null
            wait "$ACTPID" 2>/dev/null
          else
            echo "act (pid $ACTPID) has EXITED on its own"
            wait "$ACTPID"
            echo "exit status: $?"
          fi
          echo "--- act stderr (coproc probe) ---"
          cat -A /tmp/act-coproc-stderr.log
          set -e
      # Direct test of the specific confound raised for every probe above
      # except the coproc one: `printf | act` closes stdin the instant
      # printf exits, so a response arriving "promptly" is also consistent
      # with a server that only flushes on EOF, not with genuine health.
      # `{ printf …; sleep 8; }` keeps the write end of the pipe open for 8
      # seconds after the request — matching what stdio_client actually
      # does — and a timestamped read loop (not `head -c N`, whose own
      # buffering could blur the timing this is meant to settle) records
      # exactly when each line arrives relative to two markers printed
      # before and after the sleep. If the response timestamp lands near
      # the first marker, act answers live, independent of EOF; if it only
      # appears after the second, the response was gated on stdin closing
      # all along, and every "healthy" probe before the coproc one was an
      # artifact of closing stdin too fast to notice.
      - name: "Diagnostic: response timing against a stdin held open 8s"
        run: |
          set +e
          CMD=${ACT:-act}
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"probe","version":"0"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
            echo "$(date +%s.%N) STDIN: request sent, holding pipe open for 8s" >&2
            sleep 8
            echo "$(date +%s.%N) STDIN: sleep done, pipe about to close (EOF)" >&2
          } | timeout 15 $CMD run target/wasm32-wasip2/release/component_webdriver_bidi.wasm --mcp --allow wasi:sockets 2>/tmp/act-timing-stderr.log \
            | { while IFS= read -r -t 15 line; do echo "$(date +%s.%N) GOT LINE: $line"; done; echo "$(date +%s.%N) read loop ended (EOF or its own timeout)"; }
          echo "--- act stderr (timing probe) ---"
          cat -A /tmp/act-timing-stderr.log
          set -e
      # The 2x2 this hang actually needs. `just test` (below) is cell A:
      # full suite, mock enabled — always hangs. Cell B, below, first showed
      # a clean pass: test_list_tools.py alone, mock disabled. But that
      # toggled TWO variables at once, not one — it also swapped a
      # session-opening test set for a test that opens no session at all
      # (test_list_tools.py needs only a connected client; every other test
      # in this suite calls the virtual `open_session` tool, which makes the
      # guest open a real WebSocket to the mock). A stdin=DEVNULL fix aimed
      # at the mock's Popen child, tested with the mock enabled and the full
      # suite (cell A with one variable changed), still hung — reverted, see
      # that commit. So cell B's result is explained at least as well by
      # "the one green run never opened a session" as by "the mock's
      # process". Cells C and D fill in the missing corners, holding one
      # variable fixed each time instead of two.
      - name: "Diagnostic: cell B — list_tools alone, mock disabled"
        run: |
          set +e
          SKIP_MOCK_BIDI=1 ACT="${ACT:-act}" timeout 60 uv run --project e2e pytest e2e/test_list_tools.py -v
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::CELL B HUNG (timed out after 60s)"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::CELL B FAILED for a reason other than a hang (exit $code)"
          else
            echo "CELL B PASSED (list_tools, no mock, no session)"
          fi
      # Cell C is the decisive one: same single test as cell B (no session
      # opened), but with the mock ENABLED this time — holding the test set
      # fixed and toggling only the mock. If this passes, the mock's
      # existence and its socket are both cleared and the hang lives
      # specifically in `open_session`'s guest-side WebSocket handshake — a
      # much smaller target. If it hangs, the mock genuinely is upstream of
      # the hang independent of sessions.
      - name: "Diagnostic: cell C — list_tools alone, mock enabled"
        run: |
          set +e
          ACT="${ACT:-act}" timeout 60 uv run --project e2e pytest e2e/test_list_tools.py -v
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::CELL C HUNG (timed out after 60s) — the mock's existence/socket is implicated"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::CELL C FAILED for a reason other than a hang (exit $code)"
          else
            echo "CELL C PASSED — mock's existence/socket cleared, target narrows to open_session's WebSocket handshake"
          fi
      # Cell D for completeness: the full suite, mock disabled. The
      # session-opening tests will try to open a real WebSocket to a port
      # nothing is listening on — worth seeing whether that fails fast
      # (connection refused) or hangs too.
      - name: "Diagnostic: cell D — full suite, mock disabled"
        run: |
          set +e
          SKIP_MOCK_BIDI=1 ACT="${ACT:-act}" timeout 60 uv run --project e2e pytest e2e/ -v
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::CELL D HUNG (timed out after 60s)"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::CELL D FAILED for a reason other than a hang (exit $code) — check whether it was a fast, clean connection-refused"
          else
            echo "CELL D PASSED (unexpected: session-opening tests succeeded with nothing listening)"
          fi
      - run: just test
      # Always, not just on failure: a cancellation (the fate of the very
      # first hang this investigation hit) skips normal failure reporting
      # entirely, and that is exactly the run most worth seeing this for.
      - name: "Diagnostic: dump act's stderr from the actual pytest run"
        if: always()
        run: cat -A .pytest-act-stderr.log || echo "no .pytest-act-stderr.log found"

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [e2e, lint, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      id-token: write     # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - uses: sigstore/cosign-installer@v4.1.2
      - run: just init
      - name: Publish
        id: publish
        env:
          OCI_USERNAME: __token__
          OCI_PASSWORD: ${{ secrets.ACTPKG_TOKEN }}
          ACT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: just publish
      - name: Sign (keyless via GitHub OIDC)
        if: steps.publish.outputs.digest != ''
        env:
          ACTPKG_TOKEN: ${{ secrets.ACTPKG_TOKEN }}
          SUBJECT: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
        run: |
          echo "$ACTPKG_TOKEN" | cosign login actpkg.dev -u __token__ --password-stdin
          cosign sign --yes "$SUBJECT"
