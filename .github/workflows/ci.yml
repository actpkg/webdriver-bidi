name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      # `just init` fetches wit/deps; without it the build has no WIT to bind against.
      - run: just init
      - run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/*.wasm

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - run: cargo fmt -- --check
      - run: just init
      - run: cargo clippy -- -D warnings

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - run: just init
      # Unit tests run on the host target, not wasm.
      - run: just unit

  e2e:
    name: E2E Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - run: npm i -g @actcore/act @actcore/act-build
      # Rebuild rather than download: `just test` packs, and packing an
      # artifact without wit/deps present yields no declared ceiling, so every
      # grant is denied and the e2e fails confusingly.
      - run: just init
      - run: just build
      # Diagnostic for a CI-only hang under active investigation: this calls
      # only the guest's `list-tools` export (what the MCP host asks for
      # during `initialize`, before serving begins) — no MCP, no stdio
      # server, no session, no capability grant. It splits the hang cleanly:
      # if this hangs too, the guest itself stalls in list-tools; if it
      # succeeds, the stall is in the stdio serving path between this call
      # and the `initialize` response. `set +e`/`set -e` bracket the probe so
      # a hang or failure here doesn't block `just test` from also running
      # and yielding its own evidence in the same run.
      - name: "Diagnostic: probe list-tools directly"
        run: |
          set +e
          timeout 60 act info target/wasm32-wasip2/release/component_webdriver_bidi.wasm --tools --format json
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::LIST-TOOLS HUNG (timed out after 60s)"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::LIST-TOOLS FAILED (exit $code, not a timeout)"
          else
            echo "LIST-TOOLS SUCCEEDED"
          fi
      # Fourth hypothesis: MCP over stdio uses stdout as the protocol
      # channel, so a single stray byte written to stdout by the guest (or
      # anything linked into it) before or instead of a JSON-RPC frame would
      # corrupt framing — the client would then wait forever for a valid
      # message with no error and no close, exactly matching every
      # observation so far (list-tools unaffected because there stdout is
      # plain output, not a protocol stream; the audit banner always visible
      # because it is on stderr; `initialize` never completing). This feeds
      # one raw `initialize` request on stdin and dumps whatever comes back
      # on stdout, byte for byte (`cat -A` so stray whitespace/control
      # characters are visible rather than invisible). stderr is discarded —
      # the audit trail's content is already known and would only add noise
      # here. `set -o pipefail` so a mid-pipe timeout/kill is reflected in
      # `code` rather than swallowed by `cat -A`'s own clean exit.
      - name: "Diagnostic: raw initialize response over stdout"
        run: |
          set +e
          set -o pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"probe","version":"0"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | timeout 20 act run target/wasm32-wasip2/release/component_webdriver_bidi.wasm --mcp --allow wasi:sockets 2>/dev/null \
            | head -c 800 | cat -A
          code=$?
          set +o pipefail
          set -e
          echo "(end of probe output, pipeline exit $code)"
          if [ "$code" -ne 0 ]; then
            echo "::warning::PROBE TIMED OUT or failed (pipeline exit $code) — no valid response captured above"
          fi
      # Fifth angle: the pytest suite's `client` fixture never passes `env=`
      # to fastmcp's StdioTransport, so the underlying `mcp.client.stdio`
      # library spawns `act run` under a deliberately restricted environment
      # — on POSIX just HOME, LOGNAME, PATH, SHELL, TERM, USER
      # (`get_default_environment()` in the `mcp` package) — not the full job
      # environment the two probes above ran under. If `ACT` is unset here,
      # the justfile's/fixture's fallback command is resolved fresh inside
      # that six-variable environment too, so it matters concretely what it
      # resolves to.
      - name: "Diagnostic: what ACT resolves to"
        run: |
          echo "ACT=[${ACT:-<unset>}]"
          command -v act || echo "no bare 'act' on PATH"
      # Reproduce the exact restricted environment above, still with zero
      # Python/asyncio involved: if this hangs, the six-variable environment
      # is implicated regardless of asyncio's subprocess machinery; if it
      # answers cleanly like the previous probe, asyncio comes back into
      # frame and this environment is exonerated. `$CMD` mirrors the
      # fixture's own fallback (`os.environ.get("ACT", "act")`, word-split)
      # rather than hardcoding `act`, so this tests what the suite actually
      # invokes, not an assumption about it.
      - name: "Diagnostic: raw initialize response under stdio_client's restricted env"
        run: |
          set +e
          set -o pipefail
          CMD=${ACT:-act}
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"probe","version":"0"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | timeout 20 env -i HOME="$HOME" LOGNAME="$LOGNAME" PATH="$PATH" SHELL="$SHELL" TERM="$TERM" USER="$USER" \
              $CMD run target/wasm32-wasip2/release/component_webdriver_bidi.wasm --mcp --allow wasi:sockets 2>/dev/null \
            | head -c 800 | cat -A
          code=$?
          set +o pipefail
          set -e
          echo "(end of probe output, pipeline exit $code)"
          if [ "$code" -ne 0 ]; then
            echo "::warning::RESTRICTED-ENV PROBE TIMED OUT or failed (pipeline exit $code) — no valid response captured above"
          fi
      - run: just test

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [e2e, lint, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      id-token: write     # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm i -g @actcore/act @actcore/act-build
      - uses: sigstore/cosign-installer@v4.1.2
      - run: just init
      - name: Publish
        id: publish
        env:
          OCI_USERNAME: __token__
          OCI_PASSWORD: ${{ secrets.ACTPKG_TOKEN }}
          ACT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: just publish
      - name: Sign (keyless via GitHub OIDC)
        if: steps.publish.outputs.digest != ''
        env:
          ACTPKG_TOKEN: ${{ secrets.ACTPKG_TOKEN }}
          SUBJECT: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
        run: |
          echo "$ACTPKG_TOKEN" | cosign login actpkg.dev -u __token__ --password-stdin
          cosign sign --yes "$SUBJECT"
